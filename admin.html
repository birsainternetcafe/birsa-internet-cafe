<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
</head>

<body>

<h2>Orders</h2>
<ul id="list"></ul>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDimbnYS6PBQYoNwTElwXumrABHti9eAQ0",
  authDomain: "birsa-cafe.firebaseapp.com",
  projectId: "birsa-cafe",
  storageBucket: "birsa-cafe.firebasestorage.app",
  messagingSenderId: "353394648547",
  appId: "1:353394648547:web:9a0e4a5af2e898f02b2cd6"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

db.collection("orders").orderBy("time","desc")
.onSnapshot(snapshot => {

  let list = document.getElementById("list");
  list.innerHTML = "";

  snapshot.forEach(doc => {
    let o = doc.data();
    list.innerHTML += `<li>${o.name} - ₹${o.amount} (${o.service})</li>`;
  });

});
</script>

</body>
</html>
